# Static server for passphrase-generator. Installed as
# /etc/nginx/conf.d/default.conf in nginxinc/nginx-unprivileged (listens on
# 8080, pid/temp paths already under /tmp, so it runs non-root + read_only).

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    # No request logging; errors still go to the container's stderr.
    access_log off;
    charset utf-8;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_vary on;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    include /etc/nginx/security-headers.conf;

    # Liveness probe for Docker HEALTHCHECK and uptime monitoring.
    location = /healthz {
        access_log off;
        default_type text/plain;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        return 200 "ok\n";
    }

    # Fonts: content rarely changes; cache hard.
    location /fonts/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # CSS/JS/data: filenames are not hashed, so short cache + revalidate
    # (Watchtower redeploys; nginx emits ETag/Last-Modified).
    location ~* ^/(css|js|data)/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
        try_files $uri =404;
    }

    location = /favicon.svg {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
    }

    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }
}
